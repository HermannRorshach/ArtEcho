server {
  listen 8088; # nginx будет слушать этот порт.
  charset     utf8;

  access_log  /app/www/art_echo/logs/art_echo_access.log;
  error_log   /app/www/art_echo/logs/art_echo_error.log error;

    location / {
        proxy_pass http://artecho:8000; # gunicorn запускается в контейнере python и слушает порт 8000
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias /app/www/art_echo/staticfiles/;  # ← правильный путь
        expires 30d;
    }
    location /media/ {
        alias /app/www/art_echo/media/;  # ← должно быть alias, а не root!
        expires 30d;
    }
}
