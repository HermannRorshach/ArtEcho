{% extends "base.html" %}
{% block title %}
  {{ title }}
{% endblock %}
{% block content %}

  <main>
    <div class="container py-5">
      {% include "includes/header.html" %}
      <h1>{{ title }}</h1>

      <a href="{% url 'reviews:create_title' %}">Добавить произведение</a>

        {% for instance in object_list %}
            <p>{{ instance }} <a href="{% url 'reviews:title_detail' instance.pk %}">Перейти к произведению</a></p>

        {% endfor %}
    </div>
  </main>
{% endblock %}
