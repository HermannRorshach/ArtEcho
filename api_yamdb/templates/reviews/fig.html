<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .custom-select {
            position: relative;
            width: 200px;
            cursor: pointer;
            user-select: none;
        }
        .selected {
            background-color: #6E4E39;
            color: #F2F2F0;
            padding: 10px;
            border: 1px solid #6E4E39;
            min-height: 40px;
        }
        .options {
            display: none;
            position: absolute;
            width: 100%;
            background-color: #6E4E39;
            border: 1px solid #6E4E39;
            z-index: 100;
        }
        .option {
            padding: 10px;
            color: #F2F2F0;
            cursor: pointer;
        }
        .option:hover {
            background-color: #5a3e2c;
        }
        .option.selected {
            background-color: #4b3526;
        }
        .show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="custom-select" id="customSelect">
        <div class="selected">Выберите варианты</div>
        <div class="options">
            <div class="option" data-value="1">Опция 1</div>
            <div class="option" data-value="2">Опция 2</div>
            <div class="option" data-value="3">Опция 3</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
        const select = document.getElementById("customSelect");
        const selected = select.querySelector(".selected");
        const options = select.querySelector(".options");
        const optionElements = select.querySelectorAll(".option");

        let selectedValues = [];

        selected.addEventListener("click", function () {
            options.classList.toggle("show");
        });

        optionElements.forEach(option => {
            option.addEventListener("click", function () {
                const value = this.dataset.value;
                const text = this.textContent;

                if (selectedValues.includes(value)) {
                    selectedValues = selectedValues.filter(v => v !== value);
                    this.classList.remove("selected");
                } else {
                    selectedValues.push(value);
                    this.classList.add("selected");
                }

                selected.textContent = selectedValues.length ? selectedValues.map(v =>
                    select.querySelector(`.option[data-value="${v}"]`).textContent
                ).join(", ") : "Выберите варианты";
            });
        });

        document.addEventListener("click", function (e) {
            if (!select.contains(e.target)) {
                options.classList.remove("show");
            }
        });
    });


    </script>
</body>
</html>
